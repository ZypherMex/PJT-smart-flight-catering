<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Catering — Welcome</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="wordmark">fly<span>cater</span><span class="dot">.</span></div>
      <nav class="topbar-nav">
        <a href="menu.html">Dining</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <div class="hero-eyebrow">Smart Flight Catering &middot; Fly Better</div>
      <h1>Who's flying<br>this screen?</h1>
      <p class="hero-sub">Choose Cabin Crew to manage a flight's seat map, or Customer to pick your own seat and order your meal.</p>
    </div>
  </section>

  <main class="main-content">
    <section class="card fleet-card">
      <div class="fleet-grid">
        <button type="button" class="aircraft-card role-card" id="customerCard">
          <div class="role-icon-badge role-icon-customer">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
              <path d="M4 20c0-3.6 3.6-6 8-6s8 2.4 8 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="aircraft-name">Customer</div>
          <p class="aircraft-tagline">Pick your seat, set your health &amp; dietary preferences, and order your meal.</p>
          <div class="aircraft-meta"><span class="badge badge-live">Start here</span><span class="role-card-arrow">&#8594;</span></div>
        </button>
        <button type="button" class="aircraft-card role-card" id="crewCard">
          <div class="role-icon-badge role-icon-crew">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M21 14l-6.5-3.5V5a1.5 1.5 0 0 0-3 0v5.5L5 14v2l6.5-2 .5 4.5-2 1.5v1.5l3-1 3 1v-1.5l-2-1.5.5-4.5L21 16z" fill="currentColor"/>
            </svg>
          </div>
          <div class="aircraft-name">Cabin Crew</div>
          <p class="aircraft-tagline">Select a flight and review what every passenger has ordered.</p>
          <div class="aircraft-meta"><span class="badge badge-muted">Passkey required</span><span class="role-card-arrow">&#8594;</span></div>
        </button>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="passkeyModal" hidden>
    <div class="modal-box">
      <h3>Cabin Crew Access</h3>
      <p>Enter the 6-digit crew passkey to continue.</p>
      <input type="password" inputmode="numeric" maxlength="6" class="modal-input" id="passkeyInput" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;">
      <div class="modal-error" id="passkeyError" hidden>Incorrect passkey. Try again.</div>
      <div class="modal-actions">
        <button type="button" class="close-btn" id="passkeyCancel">Cancel</button>
        <button type="button" class="randomize-btn modal-submit" id="passkeySubmit">Unlock</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/roleSelect.js"></script>
</body>
</html>
