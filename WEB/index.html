<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Catering — Choose Your Aircraft</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="wordmark">fly<span>cater</span><span class="dot">.</span></div>
      <nav class="topbar-nav">
        <a class="active" href="index.html">Fleet</a>
        <a href="menu.html">Dining</a>
        <a href="#">Operations</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <div class="hero-eyebrow">Smart Flight Catering &middot; Fly Better</div>
      <h1>Choose your<br>aircraft.</h1>
      <p class="hero-sub">Pick an aircraft type to open its seat map and manage passenger dining, allergy and medical preferences.</p>
    </div>
  </section>

  <main class="main-content">
    <section class="card fleet-card">
      <div class="card-header">
        <div class="legend">
          <span><span class="sw-dot"></span>Available now</span>
          <span><span class="sw-dot sw-dot-muted"></span>Coming soon</span>
        </div>
      </div>
      <div class="fleet-grid" id="fleetGrid">
        <div class="panel-placeholder">Loading fleet&hellip;</div>
      </div>
    </section>
  </main>

  <script type="module" src="js/home.js"></script>
</body>
</html>
